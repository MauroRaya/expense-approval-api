services:
  db:
    image: mysql:9.5
    restart: always
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_ROOT_PASSWORD: 'password'
      MYSQL_ROOT_HOST: '%'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - './mysql-data/db:/var/lib/mysql'

  adminer:
    image: adminer:5.4.1
    restart: always
    ports:
      - '8080:8080'
